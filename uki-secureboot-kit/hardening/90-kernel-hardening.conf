# Kernel hardening sysctl — applied 2026-04-15
# Complements boot-time cmdline hardening params.
# nvidia-compatible (no lockdown, no module.sig_enforce)

#==============================================================================
# Kernel pointer and memory exposure
#==============================================================================

# Hide kernel pointers from all users (even root gets zeros in logs)
# Prevents using /proc/kallsyms for exploit development
kernel.kptr_restrict = 2

# Restrict dmesg to root (already 1, enforce it here)
kernel.dmesg_restrict = 1

# Disable kexec — prevents loading a new kernel at runtime
# One-way toggle: once set to 1, requires reboot to re-enable
# Blocks: kexec-based rootkits, cold-boot pivots
kernel.kexec_load_disabled = 1

# Restrict SysRq to safe subset: sync(16) + remount-ro(32) + term(64) + reboot(128) + SAK(4)
# Preserves REISUB emergency sequence, blocks memory dumps(8) and console log changes(2)
kernel.sysrq = 244

# Restrict perf to root only (3 = no unprivileged access at all)
kernel.perf_event_paranoid = 3

# Prevent SUID programs from creating core dumps (credential leak vector)
fs.suid_dumpable = 0

# Harden BPF JIT compiler against spraying attacks
net.core.bpf_jit_harden = 2

# YAMA ptrace scope: restrict to parent process only (already 1, enforce)
kernel.yama.ptrace_scope = 1

#==============================================================================
# Filesystem hardening
#==============================================================================

# Restrict FIFO/regular file creation in world-writable sticky dirs
# Level 2: ownership checks apply to group-writable dirs too
fs.protected_fifos = 2
fs.protected_regular = 2

# Hardlink/symlink protections (already 1, enforce)
fs.protected_hardlinks = 1
fs.protected_symlinks = 1

#==============================================================================
# Network hardening
#==============================================================================

# Don't send ICMP redirects (this machine is not a router)
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Don't accept ICMP redirects (already 0 for most, enforce all)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Don't accept source-routed packets
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Log martian (spoofed/impossible) packets
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Strict reverse path filtering (already 1, enforce)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# SYN flood protection (already 1, enforce)
net.ipv4.tcp_syncookies = 1

# Ignore bogus ICMP error responses (already 1, enforce)
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Note: IPv6 RA left enabled — only used by WARP tunnel, not physical interface.
# Disabling would be safe today but could break future network configs.
