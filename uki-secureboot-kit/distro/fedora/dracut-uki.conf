# /etc/dracut.conf.d/uki.conf
# Tells dracut to emit Unified Kernel Images instead of separate kernel+initramfs.

uefi="yes"
uefi_stub="/usr/lib/systemd/boot/efi/linuxx64.efi.stub"

# kernel_cmdline read from /etc/kernel/cmdline by ukify integration; for direct
# `dracut --uki` use, uncomment and set:
# kernel_cmdline="root=UUID=<root-uuid> ro rhgb quiet"

# Compress aggressively — UKIs include a full initramfs and matter for ESP space
compress="zstd"
