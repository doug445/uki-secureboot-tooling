# Reference mkinitcpio.conf for sd-encrypt (systemd-based) initramfs.
# Designed for: LUKS2 root, optional Btrfs, NVIDIA optional.
# Strip the nvidia entries from MODULES if the target rig has Intel/AMD graphics.
#
# Apply with care: copy on top of /etc/mkinitcpio.conf only after backing up,
# then run `mkinitcpio -P`.

# MODULES loaded at very early init.
#   btrfs        — needed if /  is on Btrfs (otherwise drop)
#   nvidia*      — needed for KMS handover during boot (otherwise drop)
MODULES=(btrfs nvidia nvidia_modeset nvidia_uvm nvidia_drm)

BINARIES=()
FILES=()

# HOOKS for sd-encrypt (systemd-based) — replaces the legacy `encrypt` hook.
#   systemd      — run a real PID 1 in the initramfs
#   sd-vconsole  — keymap + consolefont (replaces 'keymap' + 'consolefont')
#   sd-encrypt   — reads /etc/crypttab.initramfs to unlock LUKS at boot
#   microcode    — Intel/AMD ucode auto-discovery (replaces ALL_microcode= in presets)
HOOKS=(systemd autodetect microcode modconf kms block keyboard sd-vconsole sd-encrypt filesystems fsck)
